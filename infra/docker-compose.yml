services:
  upwork-agent:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: upwork-agent
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    shm_size: '2gb'
    env_file: .env
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    tmpfs:
      - /tmp:size=1g,mode=1777
      - /var/tmp:size=256m,mode=1777
    volumes:
      - upwork-data:/app/data
      - claude-auth:/app/data/home/.claude
      - ../data/profile.md:/app/data/profile.md:ro
    ports:
      - "127.0.0.1:6080:6080"
    environment:
      DISPLAY: :99
      BOT_TOKEN: ${BOT_TOKEN}
      CHAT_ID: ${CHAT_ID}
      ALLOWED_USERS: ${ALLOWED_USERS}
      TIMEZONE: ${TIMEZONE:-Europe/Lisbon}
      SEARCH_INTERVAL_MIN: ${SEARCH_INTERVAL_MIN:-20}
      CHROME_PATH: /usr/bin/google-chrome-stable
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}
      CLAUDE_ACCOUNT_UUID: ${CLAUDE_ACCOUNT_UUID}
      CLAUDE_EMAIL: ${CLAUDE_EMAIL}
      CLAUDE_ORG_UUID: ${CLAUDE_ORG_UUID}
      HOME: /app/data/home
      XDG_CONFIG_HOME: /app/data/home/.config
      XDG_CACHE_HOME: /app/data/home/.cache
      XDG_RUNTIME_DIR: /tmp/runtime-agent
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  upwork-data:
  claude-auth:
