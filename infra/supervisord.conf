[supervisord]
nodaemon=true
logfile=/app/data/logs/supervisord.log
logfile_maxbytes=10MB
pidfile=/tmp/supervisord.pid
childlogdir=/app/data/logs

[program:xvfb]
command=Xvfb :99 -screen 0 1920x1080x24
autorestart=true
priority=10

[program:x11vnc]
command=/bin/sh -lc 'exec x11vnc -display :99 -forever -shared -localhost -nopw -noxdamage -rfbport 5900'
autorestart=true
priority=20

[program:novnc]
command=/bin/sh -lc 'exec websockify --web /usr/share/novnc 6080 localhost:5900'
autorestart=true
priority=30

[program:daemon]
command=yarn daemon
directory=/app
environment=DISPLAY=":99",HOME="/app/data/home",XDG_CONFIG_HOME="/app/data/home/.config",XDG_CACHE_HOME="/app/data/home/.cache",XDG_RUNTIME_DIR="/tmp/runtime-agent"
autorestart=true
priority=40
stdout_logfile=/app/data/logs/daemon.stdout.log
stderr_logfile=/app/data/logs/daemon.stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
